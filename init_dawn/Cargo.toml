[package]
name = "init_dawn"
version = "1.0.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c3"] }
esp-backtrace = { version = "0.14.0", features = ["esp32c3", "print-uart"] }
esp-println = { version = "0.13.0", features = ["esp32c3"] }
st7789 = { version = "0.2.0", default-features = false }
display-interface-spi = "0.5.0"
embedded-graphics = "0.8.1"
heapless = "0.8.0"

[features]
default = ["esp32c3"]
esp32c3 = ["esp-hal/esp32c3"]

[profile.release]
opt-level = "z"
lto = true
debug = false
codegen-units = 1

